; PlatformIO project config
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; WiFiClientSecure (TLS) runs inside loop(); the default 8 KB loop task
; stack can overflow during the mbedTLS handshake.
build_flags =
    -D ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/RTClib
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11